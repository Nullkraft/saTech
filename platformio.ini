; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nucleo
extra_configs =
  platformio_override.ini

[env]
build_flags =
  -D SPECANN_APP=1
lib_deps =
  ../../embedded-device-drivers/W25N_Flash_library
  ../../embedded-device-drivers/MAX2871_library_dev

[env:nucleo]
platform = ststm32
board = nucleo_f446re
framework = arduino 

[env:uno]
platform = atmelavr
board = uno
framework = arduino
test_build_src = yes
build_flags =
  ${env.build_flags}
  -D SPECANN_TARGET_UNO=1

[env:technician]
platform = atmelavr
board = uno
framework = arduino
test_build_src = yes
build_flags =
  ${env.build_flags}
  -D SPECANN_TARGET_UNO=1
  -D SATECH_TECHNICIAN_CONSOLE=1
; platform_packages = platformio/tool-avrdude@8.1

[env:nucleo_technician]
platform = ststm32
board = nucleo_f446re
framework = arduino
build_flags =
  ${env.build_flags}
  -D SPECANN_TARGET_UNO=1
  -D SATECH_TECHNICIAN_CONSOLE=1

[env:ci]
platform = atmelavr
board = uno
framework = arduino
build_flags =
  ${env.build_flags}
test_ignore = *

; pio test -e native // to trigger local tests
[env:native]
platform = native
test_build_src = no
